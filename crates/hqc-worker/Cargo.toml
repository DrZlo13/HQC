[package]
name = "hqc-worker"
description = "hqc worker daemon: runtime adapters, MCP server, mirror, workspaces (SPEC §2, §5, §8, §9, §14)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hqc-proto = { path = "../hqc-proto" }
hqc-claude-jsonl = { path = "../hqc-claude-jsonl" }
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
croner = "4"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.9"
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"
ssh-key = { version = "0.6", features = ["std", "ed25519", "encryption", "getrandom"] }
# `hqc_publish` packs a folder into a zip (SPEC §7, §12): deflate only.
zip = { version = "6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
