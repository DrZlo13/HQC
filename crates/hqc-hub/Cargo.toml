[package]
name = "hqc-hub"
description = "hqc hub: state, routing, client and worker APIs (SPEC §2, §5, §6)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hqc-proto = { path = "../hqc-proto" }
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
web-push = { version = "0.11", default-features = false }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
futures-util = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.29"
