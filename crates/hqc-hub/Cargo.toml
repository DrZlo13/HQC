[package]
name = "hqc-hub"
description = "hqc hub: state, routing, client and worker APIs (SPEC §2, §5, §6)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hqc-proto = { path = "../hqc-proto" }
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
axum = { version = "0.8", features = ["ws", "multipart"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
jsonwebtoken = "10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
web-push = { version = "0.11", default-features = false }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
# The hub cron (SPEC §16): 5-field cron patterns and IANA time zones.
croner = "4"
chrono-tz = "0.10"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["multipart"] }
tokio-tungstenite = "0.29"
# The live end-to-end test of T15 (tests/live_takeover.rs) runs a real worker in process.
hqc-worker = { path = "../hqc-worker" }
tokio-util = "0.7"
