name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hqc
          POSTGRES_PASSWORD: hqc
          POSTGRES_DB: hqc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hqc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HQC_TEST_DATABASE_URL: postgresql://hqc:hqc@localhost:5432/hqc_test
      # Full debug info makes the clippy and test build ~12 GB, about all the runner's disk
      # holds; line tables keep file:line in backtraces and halve it.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  # The worker for Linux as one static binary (musl): runs on any x86_64 Linux, taken from
  # the artifacts of the run.
  worker-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # musl-gcc for the C parts: ring and the bundled SQLite.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p hqc-worker --target x86_64-unknown-linux-musl
      - run: |
          file target/x86_64-unknown-linux-musl/release/hqc-worker
          target/x86_64-unknown-linux-musl/release/hqc-worker --version
      - uses: actions/upload-artifact@v4
        with:
          name: hqc-worker-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/hqc-worker
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      # Same major as the client stage of the Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
