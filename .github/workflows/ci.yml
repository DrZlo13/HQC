name: ci
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hqc
          POSTGRES_PASSWORD: hqc
          POSTGRES_DB: hqc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hqc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HQC_TEST_DATABASE_URL: postgresql://hqc:hqc@localhost:5432/hqc_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
